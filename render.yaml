services:
  - type: web
    name: calculadora-proporcionais-vitalnet
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
